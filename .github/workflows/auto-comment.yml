name: Auto Comment Bot

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  auto-comment:
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'feedback') ||
       contains(github.event.issue.labels.*.name, 'suggestion'))
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close matching issue
        uses: actions/github-script@v7
        with:
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            };
            const { data: issue } = await github.rest.issues.get(params);
            const matches = issue.labels.some(label =>
              ['feedback', 'suggestion'].includes(typeof label === 'string' ? label : label.name)
            );
            if (issue.state !== 'open' || !matches) return;
            const body = 'Thank you for your contribution!';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...params,
              per_page: 100
            });
            const alreadyCommented = comments.some(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body === body
            );
            if (!alreadyCommented) {
              await github.rest.issues.createComment({ ...params, body });
            }
            await github.rest.issues.update({ ...params, state: 'closed' });
