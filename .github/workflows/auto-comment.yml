name: Auto Comment and Close

on:
  issues:
    types: [labeled, opened]

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, feedback) || contains(github.event.issue.labels.*.name, suggestion)
    steps:
      - name: Add thank you comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: "Thank you for your contribution!"
      - name: Close issue
        uses: peter-evans/close-issue@v2
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Automatically closing this issue as it is labeled feedback or suggestion."
