name: Auto Comment Bot

on:
  issues:
    types: [opened, labeled, edited]

jobs:
  auto-comment-and-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check labels and comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            const targetLabels = ["feedback", "suggestion"];
            const hasTarget = labels.some(l => targetLabels.includes(l));
            
            if (hasTarget) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Thank you for your contribution!"
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              
              console.log(`Commented and closed issue #${issue.number}`);
            } else {
              console.log("No target labels found, skipping.");
            }
