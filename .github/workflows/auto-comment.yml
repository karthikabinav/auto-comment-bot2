name: Auto Comment and Close

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  comment-and-close:
    runs-on: ubuntu-latest
    steps:
      - name: Check labels and comment
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(label => label.name);
            const targetLabels = ["feedback", "suggestion"];
            const hasTargetLabel = labels.some(label => targetLabels.includes(label));
            
            if (hasTargetLabel && context.payload.issue.state === "open") {
              // Add comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: "Thank you for your contribution!"
              });
              
              // Close issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: "closed"
              });
              
              console.log(`Commented and closed issue #${context.payload.issue.number}`);
            } else {
              console.log(`Issue #${context.payload.issue.number} does not have target labels or is already closed`);
            }
