name: Auto Comment Bot

on:
  issues:
    types: [opened, labeled]

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment and close feedback/suggestion issues
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            
            if (labels.includes("feedback") || labels.includes("suggestion")) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Thank you for your contribution!"
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              
              console.log(`Commented and closed issue #${issue.number} with labels: ${labels.join(", ")}`);
            } else {
              console.log(`Issue #${issue.number} does not have feedback/suggestion labels. Skipping.`);
            }
