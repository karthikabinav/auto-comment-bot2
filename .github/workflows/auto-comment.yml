name: Auto Comment Bot

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  comment-and-close:
    if: contains(github.event.issue.labels.*.name, 'feedback') || contains(github.event.issue.labels.*.name, 'suggestion')
    runs-on: ubuntu-latest
    concurrency:
      group: auto-comment-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Add thank-you comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const message = 'Thank you for your contribution!';

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            if (!comments.some(comment => comment.body === message)) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: message
              });
            }

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number
            });

            if (issue.state !== 'closed') {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: 'closed'
              });
            }
