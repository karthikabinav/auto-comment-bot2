name: Auto Comment on Feedback and Suggestion

on:
  issues:
    types: [opened, labeled]

jobs:
  auto_comment_and_close:
    runs-on: ubuntu-latest
    if: contains(join(github.event.issue.labels.*.name, ,), feedback) || contains(join(github.event.issue.labels.*.name, ,), suggestion)
    steps:
      - name: Add comment and close issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: Thank you for your contribution!
            });
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: closed
            });
