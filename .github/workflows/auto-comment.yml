name: Auto Comment and Close Issues

# Automatically adds a thank-you comment and closes any issue
# labeled "feedback" or "suggestion" when it is opened or labeled.
on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  comment-and-close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close qualifying issues
        uses: actions/github-script@v7
        with:
          script: |
            const triggerLabels = ['feedback', 'suggestion'];
            const issueLabels = context.payload.issue.labels.map(label => label.name);
            const shouldAct = issueLabels.some(name => triggerLabels.includes(name));
            if (!shouldAct) {
              core.info('Issue is not labeled feedback/suggestion; skipping.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: 'Thank you for your contribution!'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed'
            });
            core.info(`Commented on and closed issue #${context.payload.issue.number}`);
