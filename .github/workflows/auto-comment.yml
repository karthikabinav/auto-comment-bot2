name: Auto Comment Bot

on:
  issues:
    types: [opened, labeled]

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check labels and comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(label => label.name);
            
            // Check if issue has feedback or suggestion label
            const targetLabels = ["feedback", "suggestion"];
            const hasTargetLabel = labels.some(label => targetLabels.includes(label));
            
            if (hasTargetLabel && issue.state === "open") {
              // Add comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Thank you for your contribution!"
              });
              
              // Close the issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
              
              console.log(`Commented on and closed issue #${issue.number}`);
            } else {
              console.log(`Issue #${issue.number} does not have target labels or is already closed`);
            }