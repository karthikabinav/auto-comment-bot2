name: Auto Comment and Close on Feedback/Suggestion

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-comment-close:
    if: contains(github.event.issue.labels.*.name, 'feedback') || contains(github.event.issue.labels.*.name, 'suggestion')
    runs-on: ubuntu-latest
    steps:
      - name: Thank the author and close the issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = 'Thank you for your contribution!';
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            await github.rest.issues.createComment({ ...params, body });
            await github.rest.issues.update({ ...params, state: 'closed' });
