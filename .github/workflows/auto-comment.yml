name: Auto Comment and Close Issues

on:
  issues:
    types: [opened, labeled]

jobs:
  auto-comment-close:
    runs-on: ubuntu-latest
    if: github.event.issue.labels.*.name contains 'feedback' || github.event.issue.labels.*.name contains 'suggestion'
    steps:
      - name: Add comment and close issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = context.payload.issue.labels.map(label => label.name);
            if (labels.includes('feedback') || labels.includes('suggestion')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: 'Thank you for your contribution!'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed'
              });
              core.info(`Commented and closed issue #${context.payload.issue.number}`);
            }
