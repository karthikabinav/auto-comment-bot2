name: Automated Comment Bot

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

concurrency:
  group: auto-comment-${{ github.event.issue.node_id }}
  cancel-in-progress: false

jobs:
  auto-comment:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'feedback') || contains(github.event.issue.labels.*.name, 'suggestion')
    steps:
      - name: Add thank you comment and close
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const body = 'Thank you for your contribution!';

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number
            });

            const labelNames = issue.labels.map((label) => label.name);
            if (!labelNames.includes('feedback') && !labelNames.includes('suggestion')) {
              return;
            }

            if (issue.state !== 'open') {
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            if (!comments.some((comment) => comment.body === body && comment.user?.type === 'Bot')) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: 'closed'
            });
