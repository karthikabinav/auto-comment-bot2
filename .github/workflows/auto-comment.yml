name: Auto Comment Bot

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

concurrency:
  group: auto-comment-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  auto-comment:
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'feedback') ||
       contains(github.event.issue.labels.*.name, 'suggestion'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Thank the contributor and close matching issues
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const target = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            };
            const { data: issue } = await github.rest.issues.get(target);
            const labels = issue.labels.map(label => typeof label === "string" ? label : label.name);
            if (issue.state !== "open" ||
                !labels.some(label => ["feedback", "suggestion"].includes(label))) {
              return;
            }
            const body = "Thank you for your contribution!";
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...target, per_page: 100
            });
            const alreadyCommented = comments.some(comment =>
              comment.user?.login === "github-actions[bot]" && comment.body === body
            );
            if (!alreadyCommented) {
              await github.rest.issues.createComment({ ...target, body });
            }
            await github.rest.issues.update({ ...target, state: "closed" });
