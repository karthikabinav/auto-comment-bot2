name: Auto Comment Bot

on:
  issues:
    types: [opened, labeled]

jobs:
  comment-and-close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add comment and close issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            if (labels.includes("feedback") || labels.includes("suggestion")) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "Thank you for your contribution!"
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: "closed"
              });
              console.log(`Commented and closed issue #${context.issue.number}`);
            } else {
              console.log(`Issue #${context.issue.number} does not have target labels`);
            }
