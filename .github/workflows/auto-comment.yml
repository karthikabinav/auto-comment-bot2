name: Auto Comment Bot

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  comment-and-close:
    runs-on: ubuntu-latest
    steps:
      - name: Add comment and close labeled issue
        uses: actions/github-script@v7
        with:
          script: |
            const targetLabels = ['feedback', 'suggestion'];
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map((label) => label.name);

            if (!labels.some((label) => targetLabels.includes(label))) {
              core.info('Issue does not have a target label; skipping.');
              return;
            }

            const body = 'Thank you for your contribution!';
            const { owner, repo } = context.repo;
            const issue_number = issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            if (!comments.some((comment) => comment.body === body)) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

            if (issue.state !== 'closed') {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: 'closed',
              });
            }
