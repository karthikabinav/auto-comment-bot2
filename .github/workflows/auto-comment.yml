name: Auto Comment and Close

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  comment_and_close:
    runs-on: ubuntu-latest
    steps:
      - name: Check labels, comment and close
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(jq -r ".issue.labels[].name" "$GITHUB_EVENT_PATH")
          if echo "$LABELS" | grep -E -q "^(feedback|suggestion)$"; then
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} -b "Thank you for your contribution!"
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
          fi
