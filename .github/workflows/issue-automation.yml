name: Automated Issue Comment Bot

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-automation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  comment-and-close:
    if: >-
      (github.event.action == 'opened' && (contains(github.event.issue.labels.*.name, 'feedback') || contains(github.event.issue.labels.*.name, 'suggestion'))) ||
      (github.event.action == 'labeled' && (github.event.label.name == 'feedback' || github.event.label.name == 'suggestion'))
    runs-on: ubuntu-latest
    steps:
      - name: Add thank-you comment and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: Thank you for your contribution!
        run: |
          existing_comments=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --jq '.[].body')
          if ! printf '%s
' "$existing_comments" | grep -Fxq "$COMMENT_BODY"; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="$COMMENT_BODY" >/dev/null
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" -f state=closed >/dev/null
