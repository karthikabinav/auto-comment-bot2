name: Automated Issue Comment Bot

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  comment-and-close:
    if: >-
      contains(github.event.issue.labels.*.name, 'feedback') ||
      contains(github.event.issue.labels.*.name, 'suggestion')
    runs-on: ubuntu-latest
    steps:
      - name: Add thank-you comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const thankYou = 'Thank you for your contribution!';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });
            if (!comments.some(comment => comment.body && comment.body.trim() === thankYou)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: thankYou
              });
            }
            if (issue.state !== 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
