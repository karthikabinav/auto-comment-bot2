name: Auto comment and close feedback/suggestion issues

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  comment-and-close:
    if: contains(github.event.issue.labels.*.name, 'feedback') || contains(github.event.issue.labels.*.name, 'suggestion')
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: 'Thank you for your contribution!'
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: 'closed'
            });
