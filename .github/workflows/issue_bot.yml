name: Issue Automation
on:
  issues:
    types: [opened, labeled]

jobs:
  auto_comment_and_close:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check labels and act
        uses: actions/github-script@v7
        with:
          script: |
            const issueLabels = context.payload.issue.labels.map(l => l.name);
            const needsAction = issueLabels.includes('feedback') || issueLabels.includes('suggestion');
            if (needsAction && context.payload.issue.state === 'open') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'Thank you for your contribution!'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            }
