name: Auto comment and close issues

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  auto-comment-and-close:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'feedback') || contains(github.event.issue.labels.*.name, 'suggestion')
    steps:
      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const commentBody = 'Thank you for your contribution!';
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const alreadyCommented = comments.some(
              (comment) =>
                comment.body === commentBody &&
                comment.user &&
                comment.user.login === 'github-actions[bot]'
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody
              });
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: 'closed'
            });
