name: Auto-comment and close issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-comment-and-close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close matching issue
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const thankYouMessage = 'Thank you for your contribution!';
            const labels = context.payload.issue.labels.map(label => typeof label === 'string' ? label : label.name);
            const isMatch = labels.includes('feedback') || labels.includes('suggestion');

            if (!isMatch) {
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const alreadyCommented = comments.some(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body === thankYouMessage
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: thankYouMessage
              });
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: 'closed'
            });
